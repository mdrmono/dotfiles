[colors]
black = #000000
background = #0B0A09
background-alt = #1A1412
foreground = #D8D2CA
primary = #3C7B82
secondary = #567734
alert = #B04027
disabled = #6E6863
block-foreground = #F0ECE6
block-audio = #244247
block-input = #49322C
block-power = #3B432A
block-network = #293D4C
block-vpn = #304431
block-bluetooth = #303C50
block-tracking = #4A3A26
block-time = #34343B

[bar/main]
width = 100%
height = 30px
radius = 0

monitor = ${env:MONITOR:}

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2px

border-size = 0px
border-color = #00000000

padding-left = 0
padding-right = 2

module-margin = 0

separator =

font-0 = JetBrainsMono Nerd Font:size=9;2
font-1 = Symbols Nerd Font Mono:size=10;2

modules-left = i3
modules-right = pulseaudio openwhispr battery wlan vpn bluetooth toggl date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/secondary]
inherit = bar/main

monitor = ${env:MONITOR:}

modules-left = i3
modules-right = vpn bluetooth date toggl

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/i3]
type = internal/i3

pin-workspaces = false
index-sort = true

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.secondary}
label-visible-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#3C7B82}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "%{T2}%{T-}  "
format-volume-prefix-foreground = ${colors.block-foreground}
format-volume = <label-volume>
format-volume-background = ${colors.block-audio}
format-volume-foreground = ${colors.block-foreground}
format-volume-padding = 1

format-muted-background = ${colors.block-audio}
format-muted-padding = 1

label-volume = %percentage%%

label-muted = %{T2}%{T-}  muted
label-muted-foreground = ${colors.block-foreground}

[module/openwhispr]
type = custom/script
exec = ~/dotfiles/scripts/util/openwhispr_status.sh
tail = true
format = <label>
format-background = ${colors.block-input}
format-foreground = ${colors.block-foreground}
format-padding = 1
label = %output%
click-left = ~/dotfiles/scripts/util/openwhispr_launch.sh

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/bluetooth]
type = custom/script
exec = ~/dotfiles/scripts/util/bluetooth_status.sh
interval = 5
format-prefix = "%{T2}%{T-}  "
format-prefix-foreground = ${colors.block-foreground}
format-background = ${colors.block-bluetooth}
format-foreground = ${colors.block-foreground}
format-padding = 1
click-left = ~/dotfiles/scripts/util/bluetooth_toggle.sh

[module/toggl]
type = custom/script
exec = ~/dotfiles/scripts/util/toggl_status.sh
interval = 1
format-prefix = ""
format-background = ${colors.block-tracking}
format-foreground = ${colors.block-foreground}
format-padding = 1
click-left = ~/dotfiles/scripts/util/toggl_track.bash toggle

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
format-connected-background = ${colors.block-network}
format-connected-foreground = ${colors.block-foreground}
format-connected-padding = 1
format-disconnected-background = ${colors.block-network}
format-disconnected-foreground = ${colors.block-foreground}
format-disconnected-padding = 1
label-disconnected = %ifname% disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{T2}%{T-}  %essid%

[module/vpn]
type = custom/script
exec = ~/dotfiles/scripts/util/vpn_status.sh
interval = 5
format-background = ${colors.block-vpn}
format-foreground = ${colors.block-foreground}
format-padding = 1

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#3C7B82}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %{T2}%{T-}  %date%
format-background = ${colors.block-time}
format-foreground = ${colors.block-foreground}
format-padding = 1

[module/battery]
type = internal/battery

; Replace with your battery and adapter names
; (check with: ls /sys/class/power_supply/)
battery = BAT0
adapter = AC

; update interval in seconds
poll-interval = 30

; formats for different states
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
format-charging-background = ${colors.block-power}
format-charging-foreground = ${colors.block-foreground}
format-charging-padding = 1
format-discharging-background = ${colors.block-power}
format-discharging-foreground = ${colors.block-foreground}
format-discharging-padding = 1
format-full-background = ${colors.block-power}
format-full-foreground = ${colors.block-foreground}
format-full-padding = 1

label-charging = %{T2}%{T-}  %percentage%%
label-discharging = %{T2}%{T-}  %percentage%%
label-full = %{T2}%{T-}  %percentage%%

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
